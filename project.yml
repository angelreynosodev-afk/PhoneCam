name: PhoneCam
options:
  bundleIdPrefix: com.phonecam
  deploymentTarget:
    iOS: "15.0"
targets:
  PhoneCam:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: PhoneCam
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: PhoneCam usa la cámara para enviarla a OBS como webcam.
        NSLocalNetworkUsageDescription: PhoneCam recibe la conexión de OBS por la red local.
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phonecam.app
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
